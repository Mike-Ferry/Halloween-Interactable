<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>Trick or Treat | Mike Ferry Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: dark; --red: #d42520; --cream: #fff4e5; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; overflow: hidden; background: #101116; }
    body { font-family: "DM Sans", Arial, sans-serif; }
    button, a { font: inherit; }

    .scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #17151a;
    }
    .scene-image {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 58%;
      user-select: none;
      -webkit-user-drag: none;
    }
    .scene::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(6, 8, 14, .76) 0%, rgba(6, 8, 14, .38) 24%, rgba(6, 8, 14, .03) 47%, rgba(6, 8, 14, .10) 61%, rgba(6, 8, 14, .76) 100%);
      content: "";
    }
    .scene-trigger {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .scene-trigger:focus-visible { outline: 2px solid rgba(255,255,255,.85); outline-offset: -12px; }
    .scene-trigger:disabled { cursor: default; }

    .top-copy, .bottom-copy { position: absolute; z-index: 2; left: 50%; width: min(92vw, 760px); transform: translateX(-50%); text-align: center; pointer-events: none; }
    .top-copy { top: max(env(safe-area-inset-top), clamp(12px, 2.4vh, 28px)); }
    .brand-logo { display: block; width: clamp(148px, 25vw, 230px); height: auto; margin: 0 auto 4px; filter: drop-shadow(0 3px 9px rgba(0,0,0,.6)); }
    h1 {
      margin: 0;
      color: #fff;
      font-family: Oswald, "Arial Narrow", Impact, sans-serif;
      font-size: clamp(35px, 7.4vw, 58px);
      font-weight: 700;
      letter-spacing: .035em;
      line-height: .98;
      text-shadow: 0 3px 16px rgba(0,0,0,.72);
      text-transform: uppercase;
    }
    h1 span { color: #ff5b43; }
    .subhead {
      max-width: 510px;
      margin: 8px auto 0;
      color: #fff;
      font-size: clamp(12px, 2.5vw, 15px);
      font-weight: 800;
      letter-spacing: .16em;
      line-height: 1.4;
      text-shadow: 0 2px 11px rgba(0,0,0,.85);
      text-transform: uppercase;
    }
    .bottom-copy { bottom: max(calc(env(safe-area-inset-bottom) + 22px), clamp(28px, 5vh, 58px)); }
    .tap-label {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 17px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 999px;
      background: rgba(12,13,17,.7);
      box-shadow: 0 6px 22px rgba(0,0,0,.24);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      backdrop-filter: blur(5px);
    }
    .tap-label::before { width: 7px; height: 7px; border-radius: 50%; background: #fff; content: ""; }

    .candy-pop { --rise-midpoint: -194px; --rise-distance: -240px; position: absolute; z-index: 3; top: 44%; left: 50%; width: min(68vw, 760px); opacity: 0; transform: translate(-50%, 54px) scale(.42) rotate(-7deg); transform-origin: center; pointer-events: none; }
    .candy-photo { display: block; width: 100%; height: auto; filter: drop-shadow(0 16px 18px rgba(0,0,0,.52)); user-select: none; -webkit-user-drag: none; }
    .is-popping .candy-pop { animation: candy-rise .68s cubic-bezier(.18,.82,.25,1) forwards; }
    .deal-reveal { position: absolute; z-index: 5; top: 50%; left: 50%; display: flex; width: 56%; min-height: 50%; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px; isolation: isolate; color: #271207; text-align: center; text-shadow: none; opacity: 0; visibility: hidden; transform: translate(-50%,-50%); pointer-events: none; }
    .deal-reveal::before { position: absolute; z-index: -1; inset: -16% -14%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,238,206,.42) 0%, rgba(255,232,190,.27) 43%, rgba(255,230,185,.11) 66%, transparent 82%); -webkit-mask-image: radial-gradient(ellipse, #000 42%, rgba(0,0,0,.74) 61%, transparent 82%); mask-image: radial-gradient(ellipse, #000 42%, rgba(0,0,0,.74) 61%, transparent 82%); content: ""; pointer-events: none; }
    .deal-reveal > * { position: relative; z-index: 1; text-shadow: none; }
    .is-revealed .deal-reveal { visibility: visible; opacity: 1; transform: translate(-50%,-50%); pointer-events: auto; transition: opacity .45s ease; }
    .reveal-eyebrow { margin: 0; font-size: clamp(12px, 1.5vw, 16px); font-weight: 900; letter-spacing: .14em; line-height: 1.15; text-transform: uppercase; }
    .reveal-title { margin: 0; color: #3b1708; font-family: Oswald, "Arial Narrow", Impact, sans-serif; font-size: clamp(40px, 7.2vw, 64px); font-weight: 700; letter-spacing: .015em; line-height: .94; text-transform: uppercase; }
    .reveal-detail { max-width: 28em; margin: 1px 0 5px; font-size: clamp(13px, 1.8vw, 17px); font-weight: 900; letter-spacing: .06em; line-height: 1.2; text-transform: uppercase; }
    .promo-code-button { display: flex; width: 100%; min-height: 54px; align-items: center; justify-content: center; gap: 8px; padding: 7px 9px; border: 1px dashed rgba(62,26,8,.8); border-radius: 2px; background: rgba(255,241,209,.82); box-shadow: 0 2px 8px rgba(70,27,3,.16); color: #2c1206; cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: clamp(22px, 2.9vw, 28px); font-weight: 900; letter-spacing: .12em; }
    .promo-code-button span { font-family: "DM Sans", Arial, sans-serif; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .promo-code-button:hover { background: #fff7e8; }
    .promo-code-button:focus-visible, .events-link:focus-visible, .again-button:focus-visible { outline: 2px solid #241006; outline-offset: 2px; }
    .ticket-note { margin: 2px 0 0; color: #45200e; font-size: 11px; font-weight: 900; letter-spacing: .08em; line-height: 1.1; text-transform: uppercase; }
    .copy-status-inline { min-height: 1em; margin: 0; font-size: 12px; font-weight: 800; line-height: 1.1; }
    .events-link { display: inline-flex; min-height: 36px; align-items: center; justify-content: center; margin-top: 4px; padding: 8px 13px; border: 1px solid rgba(50,23,7,.62); border-radius: 3px; background: rgba(255,241,209,.82); box-shadow: 0 2px 8px rgba(70,27,3,.2); color: #321707; font-size: clamp(12px, 1.5vw, 15px); font-weight: 900; letter-spacing: .08em; text-decoration: none; text-transform: uppercase; transition: background .2s ease, box-shadow .2s ease, transform .2s ease; }
    .events-link:hover { background: #fff7e8; box-shadow: 0 4px 12px rgba(50,23,7,.28); transform: translateY(-1px); }
    .has-copied .events-link { border-color: #321707; background: #ffd28f; box-shadow: 0 0 0 3px rgba(255,241,209,.68), 0 5px 14px rgba(50,23,7,.34); animation: next-step-cta .42s cubic-bezier(.2,.8,.2,1); }
    .again-button { margin-top: 1px; padding: 3px 6px; border: 0; background: transparent; color: #45200e; cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .is-popping .bottom-copy, .is-revealed .bottom-copy { opacity: 0; transition: opacity .25s ease; }
    .scene-status, .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @keyframes candy-rise {
      0% { opacity: 0; transform: translate(-50%,62px) scale(.42) rotate(-7deg); }
      30% { opacity: 1; }
      78% { opacity: 1; transform: translate(-50%,var(--rise-midpoint)) scale(.98) rotate(3deg); }
      100% { opacity: 1; transform: translate(-50%,var(--rise-distance)) scale(1) rotate(0deg); }
    }
    @keyframes next-step-cta { 0% { transform: scale(.96); } 65% { transform: scale(1.045); } 100% { transform: scale(1); } }
    @media (orientation: portrait) { .scene-image { object-position: center 50%; } }
    @media (max-height: 620px) and (orientation: landscape) {
      .top-copy { top: max(env(safe-area-inset-top), 8px); }
      .brand-logo { width: 132px; margin-bottom: 0; }
      h1 { font-size: clamp(29px, 5vw, 42px); }
      .subhead { margin-top: 4px; font-size: 11px; }
      .bottom-copy { bottom: max(calc(env(safe-area-inset-bottom) + 12px), 14px); }
      .tap-label { min-height: 36px; padding: 8px 14px; }
    }
    @media (max-width: 600px) {
      .candy-pop { --rise-midpoint: -178px; --rise-distance: -220px; top: 58%; width: min(100vw, 540px); }
      .deal-reveal { width: 66%; min-height: 56%; gap: 4px; padding: 6px; }
      .reveal-eyebrow { font-size: clamp(12px, 2.7vw, 16px); }
      .reveal-title { font-size: clamp(40px, 8.8vw, 52px); }
      .reveal-detail { margin-bottom: 3px; font-size: clamp(13px, 3.3vw, 16px); }
      .promo-code-button { min-height: 54px; font-size: clamp(24px, 5.5vw, 30px); }
      .promo-code-button span { font-size: 12px; }
      .copy-status-inline { font-size: 11px; }
      .events-link { margin-top: 2px; padding: 7px 10px; font-size: clamp(11px, 2.5vw, 12px); letter-spacing: .06em; }
    }
    @media (max-width: 390px) {
      .brand-logo { width: 157px; }
      h1 { font-size: 39px; }
      .subhead { max-width: 300px; font-size: 11px; }
      .deal-reveal { width: 68%; }
      .again-button { font-size: 10px; }
    }
    @media (max-height: 620px) and (orientation: landscape) {
      .candy-pop { --rise-midpoint: -146px; --rise-distance: -180px; top: 39%; width: min(58vw, 620px); }
      .deal-reveal { width: 62%; min-height: 56%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Halloween MFO event offer">
    <img class="scene-image" src="assets/halloween-porch.png" alt="A bowl of Halloween candy on a warmly lit, spooky porch at night">
    <button class="scene-trigger" id="scene-trigger" type="button" aria-label="Tap anywhere on the Halloween porch to unwrap your treat"></button>

    <header class="top-copy">
      <img class="brand-logo" src="assets/mfo-logo-white.png" alt="Mike Ferry Organization">
      <h1>Trick <span>or</span> Treat?</h1>
      <p class="subhead">A spooky good deal is waiting for you</p>
    </header>
    <div class="bottom-copy" aria-hidden="true">
      <span class="tap-label">Tap anywhere to unwrap your treat</span>
    </div>

    <div class="candy-pop" id="candy-pop">
      <img class="candy-photo" id="candy-image" src="assets/halloween-candy-sequence-01.webp" alt="">
      <section class="deal-reveal" id="deal-reveal" aria-labelledby="deal-title" aria-hidden="true">
        <p class="reveal-eyebrow">This weekend only</p>
        <h2 class="reveal-title" id="deal-title">$25 off</h2>
        <p class="reveal-detail">Any upcoming Mike Ferry event</p>
        <button class="promo-code-button" id="copy-code" type="button" aria-label="Copy promo code BOO">BOO <span>tap to copy</span></button>
        <p class="ticket-note">New tickets only</p>
        <p class="copy-status-inline" id="copy-status" aria-live="polite"></p>
        <a class="events-link" href="https://www.mikeferry.com/product-category/event-tickets/" target="_blank" rel="noopener noreferrer">Browse upcoming events ↗</a>
        <button class="again-button" id="replay-button" type="button">Start over</button>
      </section>
    </div>
    <p class="scene-status" id="scene-status" aria-live="polite">Tap anywhere to unwrap your treat.</p>
  </main>

  <script>
    (function () {
      var scene = document.getElementById("scene");
      var trigger = document.getElementById("scene-trigger");
      var candyImage = document.getElementById("candy-image");
      var dealReveal = document.getElementById("deal-reveal");
      var copyButton = document.getElementById("copy-code");
      var copyStatus = document.getElementById("copy-status");
      var replayButton = document.getElementById("replay-button");
      var sceneStatus = document.getElementById("scene-status");
      var code = "BOO";
      var frames = [
        "assets/halloween-candy-sequence-01.webp",
        "assets/halloween-candy-sequence-02.webp",
        "assets/halloween-candy-sequence-03.webp",
        "assets/halloween-candy-sequence-04.webp",
        "assets/halloween-candy-sequence-05.webp",
        "assets/halloween-candy-sequence-06.webp",
        "assets/halloween-candy-sequence-07.webp",
        "assets/halloween-candy-sequence-08.webp",
        "assets/halloween-candy-sequence-09.webp",
        "assets/halloween-candy-sequence-10.webp",
        "assets/halloween-candy-sequence-11.webp",
        "assets/halloween-candy-sequence-12.webp",
        "assets/halloween-candy-sequence-13.webp",
        "assets/halloween-candy-sequence-14.webp",
        "assets/halloween-candy-sequence-15.webp",
        "assets/halloween-candy-sequence-16.webp",
        "assets/halloween-candy-sequence-17.webp",
        "assets/halloween-candy-sequence-18.webp",
        "assets/halloween-candy-sequence-19.webp",
        "assets/halloween-candy-sequence-20.webp",
        "assets/halloween-candy-sequence-21.webp",
        "assets/halloween-candy-sequence-22.webp",
        "assets/halloween-candy-sequence-23.webp",
        "assets/halloween-candy-sequence-24.webp",
        "assets/halloween-candy-sequence-25.webp"
      ];
      var frameMilestones = {
        4: "The wrapper twists are loosening.",
        8: "The wrapper seam is beginning to peel.",
        12: "The orange foil is unfolding in the air.",
        19: "The wrapper is opening into a square sheet.",
        24: "The inside of the wrapper is revealed."
      };
      var animationTimers = [];
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      frames.slice(1).forEach(function (src) {
        var preload = new Image();
        preload.src = src;
      });

      function clearAnimationTimers() {
        animationTimers.forEach(function (timer) { window.clearTimeout(timer); });
        animationTimers = [];
      }

      function showOffer() {
        scene.classList.add("is-revealed");
        dealReveal.setAttribute("aria-hidden", "false");
        sceneStatus.textContent = "Your treat is revealed: $25 off any upcoming Mike Ferry event. Tap BOO to copy your promo code.";
        copyStatus.textContent = "";
        copyButton.focus();
      }

      function playFrame(index) {
        if (index >= frames.length) {
          showOffer();
          return;
        }
        candyImage.src = frames[index];
        if (frameMilestones[index]) sceneStatus.textContent = frameMilestones[index];
        animationTimers.push(window.setTimeout(function () { playFrame(index + 1); }, 40));
      }

      function openDeal() {
        clearAnimationTimers();
        scene.classList.remove("is-popping", "is-revealed", "has-copied");
        dealReveal.setAttribute("aria-hidden", "true");
        candyImage.src = frames[0];
        copyStatus.textContent = "";
        copyButton.querySelector("span").textContent = "tap to copy";
        void scene.offsetWidth;
        trigger.disabled = true;
        scene.classList.add("is-popping");
        sceneStatus.textContent = "A Halloween treat is rising from the bowl.";
        if (reduceMotion.matches) {
          candyImage.src = frames[frames.length - 1];
          showOffer();
          return;
        }
        animationTimers.push(window.setTimeout(function () { playFrame(0); }, 680));
      }

      trigger.addEventListener("click", openDeal);
      replayButton.addEventListener("click", function () {
        clearAnimationTimers();
        scene.classList.remove("is-popping", "is-revealed", "has-copied");
        dealReveal.setAttribute("aria-hidden", "true");
        candyImage.src = frames[0];
        copyStatus.textContent = "";
        copyButton.querySelector("span").textContent = "tap to copy";
        trigger.disabled = false;
        sceneStatus.textContent = "Tap anywhere to unwrap your treat.";
        trigger.focus();
      });

      function showCopied() {
        scene.classList.add("has-copied");
        copyButton.querySelector("span").textContent = "copied";
        copyStatus.textContent = "Copied BOO. Enjoy $25 off any upcoming Mike Ferry event this weekend.";
        window.setTimeout(function () { copyButton.querySelector("span").textContent = "tap to copy"; }, 1800);
      }
      function fallbackCopy() {
        var field = document.createElement("textarea");
        field.value = code;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        try {
          if (document.execCommand("copy")) showCopied();
          else copyStatus.textContent = "Select and copy promo code: " + code + ".";
        } catch (error) { copyStatus.textContent = "Copy this promo code: " + code + "."; }
        field.remove();
      }
      copyButton.addEventListener("click", function () {
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(showCopied).catch(fallbackCopy);
        else fallbackCopy();
      });
    }());
  </script>
</body>
</html>
